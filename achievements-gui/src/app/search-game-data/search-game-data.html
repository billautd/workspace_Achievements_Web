<div class="search-dialog-parent">
    <mat-form-field>
        <mat-label>Game</mat-label>
        <input matInput type="text" [(ngModel)]="filterText" (keyup)="applyFilter()">
        @if (filterText) {
        <button matSuffix matIconButton (click)="clearFilterText()" class="closeButton">
            <mat-icon class="closeIcon">close</mat-icon>
        </button>
        }
    </mat-form-field>
    <mat-list class="search-dialog-games-list">
        @for (game of filteredGamesList; track game){
        <mat-list-item class="search-dialog-game" (click)="selectGame(game)">
            <div class="search-game-item">
                <div style="font-size: 18px;">{{game.Title}}</div>
                <div class="search-game-item-details">
                    <div style="width:20%">{{game.ConsoleName}}</div>
                    <div style="width:13%" class="status-text" [ngClass]="completionStatusClass(game.CompletionStatus)">
                        {{completionStatusText(game.CompletionStatus)}}</div>
                    <div style="width:20%">{{game.NumAwardedHardcore}} / {{game.MaxPossible}}</div>
                </div>
            </div>
        </mat-list-item>
        }
    </mat-list>
</div>
